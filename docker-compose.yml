services:
  db:
    image: postgis/postgis:16-3.4
    container_name: jeev-rekha-postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jeevrekha}
      POSTGRES_USER: ${POSTGRES_USER:-jeevrekha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jeevrekha}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - jeev_rekha_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  jeev_rekha_postgres_data:
